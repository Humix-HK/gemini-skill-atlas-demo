<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="為香港教師整理的六個 AI 教學及校務案例，附可複製的提示詞、成果預覽及可下載的示例。">
<title>學校 AI 技能圖譜 · Gemini Skill Atlas</title>
<style>
* { box-sizing: border-box; }
:root {
  color-scheme: light;
  --ink: #183a38;
  --body: #32423e;
  --muted: #54645c;
  --teal: #123f3e;
  --paper: #f9f7f0;
  --line: #d8d6c8;
  --gold: #a57c39;
  --serif: "Baskervville", Georgia, "Songti TC", "Noto Serif CJK TC", "PMingLiU", "SimSun", serif;
  --sans: "Microsoft JhengHei", "PingFang TC", "Microsoft YaHei", Arial, sans-serif;
}
body { margin: 0; background: var(--paper); color: var(--body); font: 16px/1.7 var(--sans); }
a { color: var(--ink); text-underline-offset: .22em; }
a:hover { color: #876023; }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid #bd7c22; outline-offset: 4px; }
button, a { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
.wrap { width: min(100% - clamp(32px, 8vw, 128px), 1410px); margin: 0 auto; }
.top { background: #fffdf6; border-bottom: 1px solid #e3decd; }
.bar, .brand, .repo, .actions, .resource, .source-tools { display: flex; align-items: center; }
.bar { min-height: 62px; justify-content: space-between; gap: 16px; }
.brand { color: var(--ink); font: 700 clamp(19px, 1.7vw, 27px)/1.1 var(--serif); letter-spacing: -.035em; gap: 11px; }
.brand-mark { width: 31px; height: 34px; background: var(--teal); border-radius: 3px 7px 4px 3px; position: relative; box-shadow: inset 3px 0 #537871; }
.brand-mark::before, .brand-mark::after { content: ""; position: absolute; width: 8px; height: 13px; top: 10px; border: 1px solid #eadfb9; border-radius: 2px; }
.brand-mark::before { left: 6px; transform: skewY(12deg); }
.brand-mark::after { left: 15px; transform: skewY(-12deg); }
.repo { gap: 8px; text-decoration: none; font-size: 14px; font-weight: 700; }
.arr { font: 16px/1 Georgia, serif; }
.hero { background: #083739; color: #fff9e9; position: relative; overflow: hidden; }
.hero-inner { position: relative; min-height: clamp(216px, 17.3vw, 275px); display: flex; align-items: center; }
.hero-copy { z-index: 1; position: relative; width: 58%; padding: 40px 0; }
.hero h1 { margin: 0; font: 700 clamp(42px, 4.8vw, 76px)/1.18 var(--serif); letter-spacing: .025em; }
.hero h1::after { content: ""; display: block; width: 38px; height: 2px; background: #d3b17c; margin: 21px 0 14px; }
.hero p { max-width: 42em; margin: 0; font-size: clamp(14px, 1.06vw, 17px); line-height: 1.7; color: #e4e8d9; }
.hero-art { position: absolute; right: 0; height: 112%; width: 43%; object-fit: contain; object-position: 66% center; mask-image: linear-gradient(90deg, transparent 0, black 12%, black 96%, transparent); }
.layout { display: grid; grid-template-columns: clamp(180px, 17vw, 244px) minmax(0, 1fr); margin-top: clamp(26px, 2.8vw, 46px); align-items: stretch; }
.sidebar { padding-right: clamp(16px, 1.9vw, 30px); border-right: 1px solid var(--line); }
.sidebar h2 { margin: 0 0 15px; padding: 0 2px 12px; border-bottom: 1px solid #a9afa0; font: 700 21px/1.25 var(--serif); color: var(--ink); }
#cases { display: grid; gap: 4px; }
#cases a { display: flex; align-items: center; gap: 12px; padding: 12px 10px; border-radius: 5px; text-decoration: none; font-size: clamp(14px, 1.03vw, 17px); font-weight: 600; }
#cases a:hover { background: #eeeade; }
#cases a[aria-current="page"] { background: var(--teal); color: #fffbed; }
.glyph { display: grid; place-items: center; width: 31px; height: 31px; flex: 0 0 auto; border: 1px solid #c4c9b7; border-radius: 7px 3px; color: #5b6e52; font: italic 700 15px/1 var(--serif); background: #eeefe2; }
.glyph::before { content: attr(data-symbol); }
#cases a:nth-child(2n) .glyph { color: #846b47; background: #f2ecdd; border-color: #d3c8ac; }
#cases a[aria-current="page"] .glyph { background: #315451; color: #eadbb4; border-color: #637d72; }
main { min-width: 0; padding-left: clamp(20px, 2.55vw, 42px); }
.casehead { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.casehead h2 { margin: 0; font: 700 clamp(31px, 2.9vw, 46px)/1.22 var(--serif); color: var(--ink); }
.download, button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 13px; font: 600 13px/1.45 var(--sans); border: 1px solid #80948b; background: transparent; color: var(--ink); border-radius: 5px; text-decoration: none; }
.download:hover, button:hover { background: #e8eee3; color: var(--ink); }
.download { flex-shrink: 0; }
.desc { margin: 12px 0 22px; color: var(--muted); max-width: 66ch; font-size: 15px; line-height: 1.8; }
.panels { display: grid; grid-template-columns: minmax(0, .84fr) minmax(0, 1.16fr); align-items: start; gap: clamp(14px, 1.6vw, 26px); }
.prompt, .sample { position: relative; min-width: 0; padding: clamp(18px, 1.8vw, 28px); border: 1px solid #d1d3c0; border-radius: 7px; }
.prompt { background: #ecf0e3; outline: 1px solid #d2d8c8; outline-offset: -5px; }
.panel-title { font: 700 20px/1.4 var(--serif); margin: 0; padding-bottom: 13px; border-bottom: 1px solid #c9d1bf; color: var(--ink); }
.prompt blockquote { margin: 17px 0 22px; font-size: clamp(15px, 1.07vw, 17px); line-height: 1.95; }
.actions { gap: 10px; flex-wrap: wrap; }
.status { font-size: 13px; color: #2b5b43; }
.sample { background: #fffef8; border-color: #d5cebc; box-shadow: 0 3px 0 -1px #ece9df, 0 5px 14px #303e2810; overflow-wrap: anywhere; }
.sample::before { content: ""; position: absolute; top: -1px; right: 23px; width: 15px; height: 26px; background: #bb9453; clip-path: polygon(0 0,100% 0,100% 100%,50% 76%,0 100%); }
.sample small { display: block; font-size: 12px; font-weight: 700; letter-spacing: .045em; color: #6f603d; padding-right: 18px; }
.sample h3 { margin: 7px 0 15px; padding: 0 0 12px; border-bottom: 1px solid #d9cfb5; font: 700 clamp(23px, 1.9vw, 30px)/1.18 var(--serif); color: var(--ink); }
.sample h4 { color: var(--ink); margin: 16px 0 4px; font-size: 15px; }
.sample p, .sample li, .sample td, .sample th { font-size: 15px; line-height: 1.65; }
.sample [lang="en"] { font-family: Georgia, var(--serif); }
.sample [lang="en"] p, .sample [lang="en"] li { font-size: 16px; }
.sample [lang="en"] h4 { font-size: 17px; }
.sample p { margin: 6px 0; }
.sample ul, .sample ol { margin: 5px 0; padding-left: 21px; }
.sample table { width: 100%; border-collapse: collapse; }
.sample td, .sample th { text-align: left; padding: 6px 8px; border-bottom: 1px solid #dcd9ca; }
.sample th { background: #edf0e6; }
.sample details { margin-top: 13px; }
.sample summary { cursor: pointer; color: var(--teal); font: 600 14px/1.6 var(--sans); }
.resource { padding: 13px 0 0; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 13px; }
.resource a { font-weight: 600; }
.source { margin-top: 32px; padding: 17px 0 24px; border-top: 1px solid #bdc3b5; }
.source-tools { flex-wrap: wrap; gap: 5px 16px; }
.source h2 { margin: 0; font: 700 18px/1.4 var(--serif); color: var(--ink); }
#source-url { font: 14px/1.6 ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }
#copy-url { font-size: 12px; padding: 5px 10px; }
.source small { color: var(--muted); font-size: 12px; }
.skip { position: absolute; left: -9999px; }
.skip:focus { left: 12px; top: 8px; background: #fffdf6; padding: 6px; z-index: 3; }
@media (max-width: 1030px) {
  .panels { grid-template-columns: 1fr; }
  .layout { grid-template-columns: 176px minmax(0, 1fr); }
  .hero-art { width: 40%; }
}
@media (max-width: 680px) {
  .wrap { width: calc(100% - 32px); }
  .bar { min-height: 55px; }
  .brand { gap: 8px; }
  .brand-mark { width: 28px; height: 30px; }
  .brand-mark::before, .brand-mark::after { top: 8px; }
  .repo { font-size: 12px; gap: 4px; }
  .hero-inner { min-height: 160px; }
  .hero-copy { width: 70%; padding: 22px 0; }
  .hero h1 { font-size: clamp(26px, 6.3vw, 38px); }
  .hero h1::after { margin: 12px 0 10px; width: 27px; }
  .hero p { font-size: 13px; max-width: 22em; }
  .hero-art { right: -12px; width: 34%; height: 88%; object-position: right center; }
  .layout { display: block; margin-top: 18px; }
  .sidebar { padding: 0 0 16px; border: 0; }
  .sidebar h2 { font-size: 17px; border: none; margin: 0 0 9px; padding: 0; }
  #cases { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 5px; }
  #cases a { gap: 7px; padding: 6px; font-size: 13px; border: 1px solid var(--line); }
  .glyph { width: 24px; height: 24px; font-size: 12px; }
  main { border-top: 1px solid var(--line); padding: 18px 0 0; }
  .desc { margin: 8px 0 13px; font-size: 14px; }
  .casehead { flex-wrap: wrap; gap: 8px; }
  .casehead h2 { font-size: 27px; }
  .download { padding: 6px 8px; font-size: 12px; }
  .source { margin-top: 22px; }
  .source h2 { width: 100%; }
  #source-url { font-size: 12px; }
}
@media print {
  .hero-art, .sidebar, .repo, .skip, .actions, .download, .resource, #copy-url { display: none; }
  .layout, .panels { display: block; }
  .hero { color: #162f2c; background: white; }
  .hero p { color: #32423e; }
  .hero-inner { min-height: auto; }
  .hero-copy { width: 100%; }
  main { padding-left: 0; }
  .prompt, .sample { margin-top: 14px; break-inside: avoid; }
}
</style>
</head>

<script>
"use strict";
const cases=[
{id:"english",folder:"01-scmp-secondary-reading-writing-assistant",title:"中學英文讀寫",desc:"用學生熟悉的校園議題連接閱讀與寫作。先找出報道中的證據，再用英文提出一項可行建議。",prompt:"請為中一學生編寫一篇關於校園減廢的英文短文。加入兩道要引用原文作答的閱讀題，以及一項寫給學生會的建議任務。請附參考答案。",level:"中一英文 · 工作紙",sample:"A second life for paper",body:`<div lang="en"><p>On Monday, Mei placed a tray beside the school printer. Its label read “Blank on one side? Use it twice.” By Friday, twenty sheets had become spelling cards. Three teachers asked for trays, but the art club kept its own box: it needed thicker paper.</p><h4>Read for evidence</h4><ol><li>What shows that the tray was useful? Quote one detail.</li><li>Why did the art club keep its own box?</li></ol><h4>Write to the student council</h4><p>In 40–60 words, suggest one place for another tray and explain how you would measure its use.</p><details><summary>參考答案</summary><p>1. “Twenty sheets had become spelling cards.” 2. The club needed thicker paper.</p></details></div>`},
{id:"calendar",folder:"02-school-calendar-planner",title:"學校校曆",desc:"把上學年的安排和新學年的限制整理成校曆草稿，供校務組逐項核對。",prompt:"請把開學週整理成一張校曆草稿。第 1、2 天依次為循環日 I、II；第 3 天為教師發展日，不推進循環。列出第 4 天的循環日，並標示仍待校方核實的資料。",level:"校務規劃 · 示範片段",sample:"開學週校曆草稿",body:`<p>以相對日序試排，正式日期由校務組填寫。</p><table><thead><tr><th>日序</th><th>活動</th><th>循環日</th></tr></thead><tbody><tr><td>第 1 天</td><td>開學及班主任課</td><td>I</td></tr><tr><td>第 2 天</td><td>常規課堂</td><td>II</td></tr><tr><td>第 3 天</td><td>教師發展日</td><td>暫停</td></tr><tr><td>第 4 天</td><td>常規課堂</td><td>III</td></tr></tbody></table><h4>定稿前核對</h4><p>由校方確認開學日期、實際假期，以及教師發展日的循環日安排。</p>`},
{id:"chinese",folder:"03-chinese-exercise-designer",title:"小學中文出題",desc:"以一段課文設計理解及推論題，讓學生從文字找線索，老師可另外查看答案和評分依據。",prompt:"請根據下面的原創短文為小五學生出兩道閱讀題：一道擷取資料，一道推論人物心情。每題列出分值，再附教師用參考答案。短文：阿朗每天替窗邊的小苗澆水。星期五，他發現第一片新葉，連書包也沒放下便跑去叫妹妹。",level:"小五中文 · 閱讀理解",sample:"窗邊的新葉",body:`<p>阿朗每天替窗邊的小苗澆水。星期五，他發現第一片新葉，連書包也沒放下便跑去叫妹妹。</p><h4>學生作答</h4><ol><li>阿朗在星期五發現了甚麼？（1 分）</li><li>你認為阿朗當時有甚麼心情？引用一個動作說明。（2 分）</li></ol><details><summary>教師參考答案與評分</summary><p>第一題：第一片新葉（1 分）。第二題：感到興奮或驚喜（1 分）；他連書包也沒放下便去叫妹妹（1 分）。</p></details>`},
{id:"social",folder:"04-social-media-post-designer",title:"校園社交帖文",desc:"讓同一個校園活動在社交平台和海報上傳達一致的訊息，保留家長需要的時間、地點和參與方式。",prompt:"請為校內交換書活動撰寫一段繁體中文社交帖文及三格海報標題。活動在午間於圖書角舉行，同學可帶一本整潔的圖書交換。語氣親切，避免加入未提供的日期或報名要求。",level:"學校傳訊 · 文案與分鏡",sample:"一本書，兩位讀者",body:`<h4>帖文草稿</h4><p>書架上有一本想推薦的好書嗎？午間帶一本整潔的圖書到圖書角，和同學交換，也帶走一個新故事。交換時，記得跟新讀者說說你最喜歡哪一頁！</p><h4>三格海報</h4><ol><li>揀一本好書：畫面是一隻手從書架抽出一本書。</li><li>午間來相遇：畫面是圖書角的交換桌。</li><li>把故事傳下去：畫面是兩位讀者交換推薦卡。</li></ol>`},
{id:"storybook",folder:"05-interactive-book-designer",title:"幼兒互動故事書",desc:"用貼近日常生活的短句和選擇題設計共讀活動，讓幼兒先想一想，再揭開故事回應。",prompt:"請為 K2 幼兒設計一頁互動故事。背景是雨後的校園，小晴想照顧快要乾掉的盆栽。用短句描述情境，給兩個可以點開的選擇，讓幼兒從後果想出照顧植物的方法。",level:"幼稚園 K2 · 親子共讀",sample:"小晴和小盆栽",body:`<p>雨停了。小晴走到有簷篷的花架旁，摸一摸盆裡的泥土。泥土乾乾的，葉子也低下了頭。</p><h4>你會怎樣幫忙？點開你的選擇。</h4><details><summary>拿小水壺，往泥土慢慢澆水</summary><p>水滲進泥土。小晴說：「明天我再來看看你！」你想到甚麼方法記住這件事？</p></details><details><summary>把一把小雨傘放在花盆旁</summary><p>小雨傘遮住了陽光，泥土還是乾的。盆栽還需要甚麼？再試另一個辦法吧。</p></details>`},
{id:"notice",folder:"06-school-notice-assistant",title:"家長通告",desc:"把活動資料寫成家長容易查閱的通告和回條。未確認的日期、費用或安排保留空位，方便校方定稿。",prompt:"請為小學親子閱讀日擬一份繁體中文家長通告，附出席回條。活動地點是學校圖書館，每名學生可由一位家長陪同。日期、時間和回覆限期仍待確認，請清楚留空。",level:"家校溝通 · 通告及回條",sample:"親子閱讀日",body:`<p>各位家長：</p><p>本校將於學校圖書館舉行親子閱讀日。每名學生可由一位家長陪同，一起選書及分享故事。</p><p>活動日期：＿＿＿＿　時間：＿＿＿＿<br>回覆限期：＿＿＿＿</p><h4>家長回條</h4><p>學生姓名：＿＿＿＿　班別：＿＿＿＿</p><p>□ 出席，將由一位家長陪同。<br>□ 未能出席。</p><p>家長簽署：＿＿＿＿　日期：＿＿＿＿</p>`}
];
const byId=id=>document.getElementById(id);
const repo = byId("source-url").href;
const nav=byId("cases");
const symbols = {english: "Aa", calendar: "▦", chinese: "文", social: "✎", storybook: "✧", notice: "✉"};
for (const item of cases) {
  const link = document.createElement("a");
  link.href = "#" + item.id;
  const glyph = document.createElement("span");
  glyph.className = "glyph";
  glyph.setAttribute("aria-hidden", "true");
  glyph.dataset.symbol = symbols[item.id];
  link.append(glyph, document.createTextNode(item.title));
  nav.append(link);
}
let active,downloadUrl;
function selectCase(){
  const id=location.hash.slice(1);
  if(id==="main" && active)return;
  active=cases.find(item=>item.id===id)||cases[0];
  for(const link of nav.children){
    if(link.hash==="#"+active.id)link.setAttribute("aria-current","page");
    else link.removeAttribute("aria-current");
  }
  document.title=active.title+" · 學校 AI 技能圖譜";
  byId("title").textContent=active.title;byId("description").textContent=active.desc;
  byId("prompt").textContent=active.prompt;byId("status").textContent="";
  const preview=byId("sample");preview.replaceChildren();
  const level=document.createElement("small");level.textContent=active.level;
  const title=document.createElement("h3");title.textContent=active.sample;
  preview.append(level,title);preview.insertAdjacentHTML("beforeend",active.body);
  byId("files").href=repo+"/tree/main/backstage/"+active.folder;
  byId("original").href=repo+"/blob/main/backstage/"+active.folder+"/skill-package.zip";
  const sheet='<!doctype html><html lang="zh-HK"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+active.sample+'</title><style>body{max-width:46rem;margin:3em auto;padding:0 1.4em;color:#152940;font:17px/1.75 system-ui,sans-serif}h1{font-family:serif}h2{font-size:1.1em;border-bottom:1px solid #aabac0}th,td{border:1px solid #84949f;text-align:left;padding:.35em .7em}table{border-collapse:collapse}summary{cursor:pointer}@media print{body{margin:.5cm}details::details-content{display:block;content-visibility:visible}}</style><header>Gemini Skill Atlas · 教學示例</header><h1>'+active.sample+'</h1><p>'+active.level+'</p>'+active.body+'<h2>提示詞範例</h2><p>'+active.prompt+'</p></html>';
  if(downloadUrl)URL.revokeObjectURL(downloadUrl);
  downloadUrl=URL.createObjectURL(new Blob([sheet],{type:"text/html;charset=utf-8"}));
  byId("download").href=downloadUrl;byId("download").download=active.title+"-教學示例.html";
}
async function copyContent(element, status) {
  try {
    await navigator.clipboard.writeText(element.textContent);
    status.textContent = "已複製";
  } catch {
    const range = document.createRange();
    range.selectNodeContents(element);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    status.textContent = "已選取文字，請使用裝置的複製功能";
  }
}
byId("copy").addEventListener("click", () => copyContent(byId("prompt"), byId("status")));
byId("copy-url").addEventListener("click", () => copyContent(byId("source-url"), byId("url-status")));
window.addEventListener("hashchange",selectCase);selectCase();
</script>
</body></html>
